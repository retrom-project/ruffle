name: Retrom Web Release
on:
  push:
    tags: [retrom-core-ge46d1642fb67-r*]
permissions:
  contents: write
concurrency:
  group: retrom-web-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Verify immutable maintenance tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^retrom-core-ge46d1642fb67-r[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          remote_tag_ref="refs/retrom-release/$GITHUB_REF_NAME"
          git fetch origin "refs/tags/$GITHUB_REF_NAME:$remote_tag_ref"
          test "$(git cat-file -t "$remote_tag_ref")" = tag
          test "$(git rev-list -n 1 "$remote_tag_ref")" = "$GITHUB_SHA"
          git fetch --no-tags origin retrom/ge46d1642fb67
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          git merge-base --is-ancestor e46d1642fb67a53b56ffa4b1871cb7c57589e36d "$GITHUB_SHA"
      - run: python3 -B -m unittest discover -s .github/rpg-runtime -p 'test_*.py'
      - name: Build and check release assets
        run: |
          mkdir "$RUNNER_TEMP/ruffle-candidate"
          bash .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/ruffle-candidate"
          bash .github/rpg-runtime/check-web.sh
          python3 -B .github/rpg-runtime/release.py --candidate "$RUNNER_TEMP/ruffle-candidate" --output "$RUNNER_TEMP/ruffle-release" --tag "$GITHUB_REF_NAME" --tag-ref "refs/retrom-release/$GITHUB_REF_NAME"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/ruffle-release/"* --verify-tag --generate-notes "${flags[@]}"
